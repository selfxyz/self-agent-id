# Weekly dependency updates. Security fixes for Dependabot alerts come as one grouped PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /app
      - /mcp
      - /typescript-sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      # Minor and patch bumps land as one PR a week; majors still open one PR each.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
