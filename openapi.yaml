        "404":
          $ref: "#/components/responses/AgentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /.well-known/a2a/{agentId}:
    get:
      tags: [Discovery]
      summary: Agent card redirect
      operationId: getA2aAgentCard
      parameters:
        - $ref: "#/components/parameters/AgentIdPath"
        - name: chain
          in: query
          description: Default 42220 (`chainId` is accepted too)
          schema:
            type: string
            enum: ["42220", "11142220"]
      responses:
        "307":
          description: Redirect to /api/cards/{chainId}/{agentId}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"

  /api/a2a:
    post:
      tags: [Discovery]
      summary: A2A JSON-RPC endpoint
      operationId: a2aJsonRpc
      description: >
        A2A v0.3.0 over JSON-RPC 2.0. Methods: `message/send`, `tasks/get`,
        `tasks/cancel` (no streaming, no push notifications). Parts use
        `kind` (`type` is accepted from older clients). The intent comes from
        a data part (`{ "intent": ..., ... }`), a text part holding JSON, or
        plain English. Intents: `register` (mode, network, humanAddress?,
        ed25519Pubkey?, ed25519Signature?, disclosures? (default none)),
        `status` (sessionToken),
        `lookup` / `verify` / `freshness` / `refresh-proof` / `deregister`
        (agentId, chainId or network), `help`. Session-starting intents return
        the session token in the task's data part (with a `pollHint`); poll
        with `{ "intent": "status", "sessionToken": ... }`, always sending the
        newest token (this works on any server instance; an unknown `taskId`
        gets JSON-RPC -32602 pointing at `sessionToken`). Registrations and
        agent intents that name no network or chain use the deployment's
        default network (mainnet unless `NEXT_PUBLIC_DEFAULT_NETWORK` says
        otherwise). `message/stream` is not supported: HTTP 400 with A2A
        error UNSUPPORTED_OPERATION (-32004); use `message/send`.


        Rate limits: `message/send` 60/min per IP. The `lookup`, `verify`,
        `freshness` and `deregister` intents and the `X-Agent-Id` check also
        spend the per-IP 120/min read budget shared with the REST query
        routes; session intents (`register`, `refresh-proof`, `status`,
        `deregister`) also count against the called route's own limit. Rate
        limits answer HTTP 429 with `Retry-After` and JSON-RPC error -32000
        (`data.retryAfterMs`). An optional `X-Agent-Id` header requires the
        calling agent to be verified on the default network (403
        otherwise). Body limit 64 KB.
      parameters:
        - name: X-Agent-Id
          in: header
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  const: "2.0"
                id:
                  type: ["string", "integer"]
                method:
                  type: string
                  enum: [message/send, tasks/get, tasks/cancel]
                params:
                  type: object
                  additionalProperties: true
            example:
              jsonrpc: "2.0"
              id: 1
              method: message/send
              params:
                message:
                  role: user
                  parts:
                    - kind: data
                      data:
                        intent: verify
                        agentId: 5
                        chainId: 11142220
      responses:
        "200":
          description: JSON-RPC result (an A2A Task)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "400":
          description: >
            JSON-RPC parse error, invalid request, invalid params, or
            `message/stream` (UNSUPPORTED_OPERATION, -32004)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "403":
          description: X-Agent-Id given but that agent is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "404":
          description: Unknown method or task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "409":
          description: Task already finished (tasks/cancel)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "413":
          description: Body over 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "415":
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "429":
          description: Rate limited (JSON-RPC error -32000, `data.retryAfterMs`)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"

  /api/mcp:
    post:
      tags: [Discovery]
      summary: MCP server (Streamable HTTP)
      operationId: mcp
      description: >
        Model Context Protocol over Streamable HTTP, stateless (send
        `Accept: application/json, text/event-stream`; GET and DELETE answer
        405). Public tools: self_lookup_agent, self_list_agents_for_human,
        self_register_agent, self_check_registration, self_verify_agent,
        self_verify_request. Privileged tools (need the `mcpPrivilegedKey`
        bearer and a server-side `SELF_AGENT_PRIVATE_KEY`):
        self_get_identity, self_deregister_agent, self_sign_request,
        self_authenticated_fetch. Tools call the REST handlers in-process, so
        each call also counts against that endpoint's per-IP limits.
        self_verify_request verifies ECDSA (secp256k1) signed requests only;
        verify Ed25519-signed requests with the TypeScript SDK's
        `SelfAgentVerifier`. Rate limit: 120/min per IP; body limit 1 MB.


        CORS: every response, including the 400/413/429 errors below,
        carries `Access-Control-Allow-Origin: *`, allows the methods GET,
        POST, DELETE, OPTIONS and the request headers Content-Type, Accept,
        Authorization, Mcp-Protocol-Version, Mcp-Session-Id and
        Last-Event-ID, and exposes Mcp-Session-Id and Mcp-Protocol-Version.
        OPTIONS answers the preflight with 204.
      security:
        - {}
        - mcpPrivilegedKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 MCP message (or batch)
              additionalProperties: true
      responses:
        "200":
          description: MCP response (JSON or an SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: JSON parse error (JSON-RPC -32700, `id` null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "413":
          description: Body over 1 MB (JSON-RPC -32600, `id` null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
