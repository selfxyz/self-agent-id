openapi: 3.1.0
info:
  title: Self Agent ID API
  version: 1.1.0
  description: >
    On-chain AI agent identity registry with proof-of-human verification.
    Register, deregister, refresh and query agents with no API keys:
    human-in-the-loop flows return an encrypted session token (30-minute TTL)
    that is sent back as `Authorization: Bearer <sessionToken>`.


    Errors are JSON `{ "error": "..." }` with CORS headers. Conventions: 400
    bad input, 401 invalid session token or visa signature, 403 not
    authorized, 404 agent not found (never minted or burned), 409 wrong
    session/agent state, 410 session expired, 413 request body over 16 KB,
    422 business rule not met, 429 rate limited (`Retry-After` header plus
    `retryAfterMs`), 500 `{ "error": "Failed to render QR code" }` whenever
    a QR image cannot be rendered (details are logged), 502
    `{ "error": "RPC error" }` when the chain could not be read. Unknown
    `/api/*` paths return a JSON 404 that points at the discovery
    endpoints.
  contact:
    name: Self Protocol
    url: https://github.com/selfxyz/self-agent-id
  license:
    name: BUSL-1.1
    url: https://github.com/selfxyz/self-agent-id/blob/main/LICENSE

servers:
  - url: https://agent-api.self.xyz
    description: Production

tags:
  - name: Registration
    description: >
      Register a new agent. The human scans a QR with the Self app; the
      registry mints the agent on-chain and the status endpoint observes it.
  - name: Lifecycle
    description: Deregister an agent, refresh its proof, or identify a human's agents.
  - name: Query
    description: Read-only on-chain lookups (no auth).
  - name: Visa
    description: >
      Celo Agent Visa reads and relayer-backed writes. Visa agent ids are
      decimal strings (wallet-based ids are `uint160(wallet)`, up to 49
      digits).


      Every write is authorized by an EIP-191 `personal_sign` signature over
      this exact message (lines joined by `\n`, no trailing newline, ids and
      chainId in canonical decimal, `newAgentId` line only for `migrate`):


      ```

      Self Agent ID visa request

      action: <claim|migrate|request-review>

      chainId: <chainId>

      agentId: <agentId>

      newAgentId: <newAgentId>

      targetTier: <targetTier>

      timestamp: <unix ms>

      ```


      The body carries `signature` (0x + 130 hex) and the same `timestamp`.
      Timestamps must be within 5 minutes of server time and each signed
      message is accepted once. The signer must be the agent NFT owner
      (`ownerOf(agentId)`), the agent's own EVM key, or, for a wallet-based
      id, that wallet. For `migrate`, `agentId` is the old wallet-based id.
      Limits: 20 write attempts per IP per hour, counted before the
      signature is checked (so a 429 there leaves the signature unused);
      relayed transactions are capped at 5 per IP, 2 per signer and 50
      globally per hour.


      A signature is consumed as soon as it verifies, so after any later
      error (4xx or 5xx) sign a fresh timestamp before retrying. A 502 that
      includes `txHash` means the relayer broadcast that transaction but
      could not confirm it: it may still mine, so check it on-chain before
      retrying.
  - name: Discovery
    description: Service discovery, agent cards, A2A and MCP.

security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The `sessionToken` from the session-start response, or the rotated
        one from the latest status response. Never accepted in the query
        string.
    mcpPrivilegedKey:
      type: http
      scheme: bearer
      description: >
        Optional MCP key (`MCP_PRIVILEGED_API_KEY` / `MCP_PRIVILEGED_API_KEYS`)
        that unlocks the privileged MCP tools on deployments that configure
        one.

  headers:
    RetryAfter:
      description: Seconds until the rate-limit window resets.
      schema:
        type: integer

  parameters:
    ChainIdPath:
      name: chainId
      in: path
      required: true
      schema:
        type: integer
        enum: [42220, 11142220]
      description: 42220 (Celo Mainnet) or 11142220 (Celo Sepolia)
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: >
        Registry agent id (canonical decimal). Ids above 2^53-1 cannot exist
        and return 404.
    VisaAgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DecimalId"

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSession:
      description: Invalid session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid session token
    SessionExpired:
      description: Session expired (30-minute TTL); start a new one
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Session expired
    AgentNotFound:
      description: Agent never minted or already burned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Agent not found
    PayloadTooLarge:
      description: Request body over 16 KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Request body too large
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
    RpcError:
      description: The chain could not be read (details are logged, never returned)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: RPC error
    ServerError:
      description: Server misconfiguration or internal failure (generic message)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionStartServerError:
      description: >
        `Server configuration error` (SESSION_SECRET unset) or
        `Failed to render QR code` (the QR image could not be rendered;
        details are logged)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Failed to render QR code
    QrRenderFailed:
      description: The QR image could not be rendered (details are logged)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Failed to render QR code
    VisaWriteFailed:
      description: >
        RPC or transaction failure. When a relayer transaction was already
        broadcast, `txHash` names it (the last one sent): it may still mine,
        so check it before retrying with a fresh signature.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              txHash:
                type: string
          example:
            error: RPC error
            txHash: "0x5b3c...e1"
    InvalidSignature:
      description: Missing, malformed, expired or already-used visa signature
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Signature expired: sign a fresh timestamp"
    RelayerNotConfigured:
      description: The deployment has no visa relayer (`RELAYER_PRIVATE_KEY` unset)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Visa relayer not configured
    QrPng:
      description: >
        QR code PNG (8 px per module with a 4-module quiet zone, roughly
        940-970 px square; scale it down with CSS). Embeddable as
        `<img src>` on any origin: served with
        `Access-Control-Allow-Origin: *`,
        `Cross-Origin-Resource-Policy: cross-origin`,
        `Content-Disposition: inline`, `X-Content-Type-Options: nosniff` and
        `Cache-Control: no-store` (the token is short-lived).
      content:
        image/png:
          schema:
            type: string
            format: binary

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RateLimitError:
      type: object
      required: [error, retryAfterMs]
      properties:
        error:
          type: string
        retryAfterMs:
          type: integer

    Network:
      type: string
      enum: [mainnet, testnet]
      description: mainnet = Celo (42220), testnet = Celo Sepolia (11142220)

    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"

    DecimalId:
      type: string
      pattern: "^[1-9][0-9]{0,77}$"
      description: Positive integer in canonical decimal (up to uint256)

    IsoDateTime:
      type: string
      format: date-time
      example: "2027-02-27T05:50:54.000Z"

    Disclosures:
      type: object
      description: >
        What the human must prove or disclose. Booleans must be JSON booleans
        (`"false"` is rejected). `minimumAge` and `ofac` select the on-chain
        verification config; the other flags only ask the Self app to
        disclose the field.
      properties:
        minimumAge:
          type: integer
          enum: [0, 18, 21]
        ofac:
          type: boolean
        nationality:
          type: boolean
        name:
          type: boolean
        date_of_birth:
          type: boolean
        gender:
          type: boolean
        issuing_state:
          type: boolean
      additionalProperties: true

    SelfApp:
      type: object
      description: >
        The Self app verification request (`SelfAppBuilder` output) encoded
        in `deepLink`. Pass it to `@selfxyz/qrcode` to render the QR yourself.
      properties:
        version:
          type: integer
        appName:
          type: string
        scope:
          type: string
        endpoint:
          $ref: "#/components/schemas/Address"
        endpointType:
          type: string
          enum: [celo, staging_celo]
        chainID:
          type: integer
        userId:
          type: string
        userIdType:
          type: string
        userDefinedData:
          type: string
        disclosures:
          type: object
        sessionId:
          type: string
        deeplinkCallback:
          type: string
      additionalProperties: true

    HumanInstructions:
      type: array
      items:
        type: string

    SessionStart:
      type: object
      description: Common shape of every session-start response.
      required:
        [
          sessionToken,
          stage,
          deepLink,
          qrImageBase64,
          scanUrl,
          expiresAt,
          timeRemainingMs,
          humanInstructions,
          qrData,
        ]
      properties:
        sessionToken:
          type: string
          description: "Encrypted session token; send as `Authorization: Bearer`."
        stage:
          type: string
          const: qr-ready
        deepLink:
          type: string
          description: Self app universal link (https://redirect.self.xyz?selfApp=...)
        qrImageBase64:
          type: string
          description: "The scanUrl PNG as bare base64 (no data: prefix): embed as data:image/png;base64,<qrImageBase64>"
        scanUrl:
          type: string
          description: >
            `<base>/api/qr/<qrToken>`, a PNG of the QR that is safe to hand to
            the human or embed as `<img src>`. The QR token only renders the
            image; it is not a session token.
        expiresAt:
          $ref: "#/components/schemas/IsoDateTime"
        timeRemainingMs:
          type: integer
        humanInstructions:
          $ref: "#/components/schemas/HumanInstructions"
        qrData:
          $ref: "#/components/schemas/SelfApp"

    SessionStatus:
      type: object
      description: >
        Common shape of every status response. `sessionToken` is rotated on
        each poll: use the latest one for the next call.
      required:
        [sessionToken, stage, expiresAt, timeRemainingMs, humanInstructions]
      properties:
        sessionToken:
          type: string
        stage:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoDateTime"
        timeRemainingMs:
          type: integer
        humanInstructions:
          $ref: "#/components/schemas/HumanInstructions"

    ProofState:
      type: object
      properties:
        isVerified:
          type: boolean
          description: hasHumanProof && isProofFresh
        hasHumanProof:
          type: boolean
        isProofFresh:
          type: boolean
        proofExpiresAt:
          oneOf:
            - $ref: "#/components/schemas/IsoDateTime"
            - type: "null"

    # ── Registration ─────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [mode, network]
      properties:
        mode:
          type: string
          enum:
            [linked, wallet-free, ed25519, ed25519-linked, privy, smartwallet]
          description: >
            `linked`, `privy` and `smartwallet` (identical server-side) and
            `wallet-free` get a server-generated EVM key, exported after
            completion. `ed25519` / `ed25519-linked` register the caller's own
            Ed25519 key. Aliases `walletfree` and `smart-wallet` are accepted.
        network:
          $ref: "#/components/schemas/Network"
        humanAddress:
          allOf:
            - $ref: "#/components/schemas/Address"
          description: >
            Non-zero wallet of the human (checksum enforced if mixed case).
            Required for linked, ed25519-linked, privy and smartwallet; if sent
            in another mode it must still be valid.
        ed25519Pubkey:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: Ed25519 public key, no 0x (ed25519 modes)
        ed25519Signature:
          type: string
          pattern: "^[0-9a-fA-F]{128}$"
          description: >
            Ed25519 signature over the 32 raw bytes of `challengeHash` from
            POST /api/agent/register/ed25519-challenge (ed25519 modes)
        disclosures:
          $ref: "#/components/schemas/Disclosures"

    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/SessionStart"
        - type: object
          properties:
            agentAddress:
              $ref: "#/components/schemas/Address"
            network:
              $ref: "#/components/schemas/Network"
            mode:
              type: string
              description: Canonical mode name
            configIndex:
              type: integer
              minimum: 0
              maximum: 5
              description: On-chain verification config selected by minimumAge + ofac

    RegisterStatusResponse:
      allOf:
        - $ref: "#/components/schemas/SessionStatus"
        - type: object
          properties:
            stage:
              type: string
              enum: [qr-ready, completed]
            agentAddress:
              $ref: "#/components/schemas/Address"
            agentId:
              type: integer
              description: Present once completed
            credentials:
              type: object
              description: >
                Present on the poll that first observes completion (omitted
                if the credentials could not be read). Undisclosed fields are
                null; `olderThan` is 0 when no age was proven.
              properties:
                nationality:
                  type: ["string", "null"]
                issuingState:
                  type: ["string", "null"]
                olderThan:
                  type: integer
                ofac:
                  type: array
                  items:
                    type: boolean
                dateOfBirth:
                  type: ["string", "null"]
                gender:
                  type: ["string", "null"]
                expiryDate:
                  type: ["string", "null"]

    ExportResponse:
      type: object
      properties:
        privateKey:
          type: string
          description: 0x-prefixed secp256k1 private key of the agent
        agentAddress:
          $ref: "#/components/schemas/Address"
        agentId:
          type: integer
        network:
          $ref: "#/components/schemas/Network"
        mode:
          type: string

    # ── Lifecycle ────────────────────────────────────────────────────
    DeregisterResponse:
      allOf:
        - $ref: "#/components/schemas/SessionStart"
        - type: object
          properties:
            agentAddress:
              $ref: "#/components/schemas/Address"
            agentId:
              type: integer
            network:
              $ref: "#/components/schemas/Network"
            configIndex:
              type: integer

    RefreshResponse:
      allOf:
        - $ref: "#/components/schemas/SessionStart"
        - type: object
          properties:
            agentId:
              type: integer
            network:
              $ref: "#/components/schemas/Network"
            configIndex:
              type: integer

    AgentIdInput:
      oneOf:
        - type: integer
          minimum: 1
        - $ref: "#/components/schemas/DecimalId"
      description: Positive safe integer, or the same as a canonical decimal string

    # ── Query ────────────────────────────────────────────────────────
    AgentInfoResponse:
      allOf:
        - $ref: "#/components/schemas/ProofState"
        - type: object
          properties:
            agentId:
              type: integer
            chainId:
              type: integer
            agentKey:
              type: string
              description: >
                bytes32 key: the zero-padded address for EVM agents, the raw
                public key for Ed25519 agents
            agentAddress:
              $ref: "#/components/schemas/Address"
            proofProvider:
              $ref: "#/components/schemas/Address"
            registeredAtBlock:
              type: integer
              description: Block number of registration (not a timestamp)
            verificationStrength:
              type: integer
              description: 0-100 (100 = passport / NFC ID card)
            strengthLabel:
              type: string
              description: e.g. "passport"; "None" without a proof
            credentials:
              type: object
              properties:
                nationality:
                  type: ["string", "null"]
                  description: ISO 3166-1 alpha-3, null if not disclosed
                olderThan:
                  type: integer
                ofac:
                  type: array
                  items:
                    type: boolean
            network:
              $ref: "#/components/schemas/Network"

    AgentSummary:
      allOf:
        - $ref: "#/components/schemas/ProofState"
        - type: object
          properties:
            agentId:
              type: integer
            agentKey:
              type: string
            agentAddress:
              $ref: "#/components/schemas/Address"

    AgentCard:
      type: object
      description: >
        ERC-8004 registration document. Agent-declared fields come from the
        agent's on-chain metadata; `services` always ends with the
        `registry-a2a` entry and `selfProtocol` is rebuilt from live contract
        state.
      properties:
        type:
          type: string
          const: https://eips.ethereum.org/EIPS/eip-8004#registration-v1
        name:
          type: string
        description:
          type: string
        services:
          type: array
          items:
            type: object
            additionalProperties: true
        selfProtocol:
          type: object
          properties:
            agentId:
              type: integer
            registry:
              $ref: "#/components/schemas/Address"
            chainId:
              type: integer
            agentKey:
              type: string
            agentAddress:
              $ref: "#/components/schemas/Address"
            isVerified:
              type: boolean
            proofExpiresAt:
              type: ["string", "null"]
            registeredAtBlock:
              type: integer
            proofProvider:
              $ref: "#/components/schemas/Address"
            providerName:
              type: string
            verificationStrength:
              type: integer
            trustModel:
              type: object
              additionalProperties: true
            credentials:
              type: object
              additionalProperties: true
      additionalProperties: true

    # ── Visa ─────────────────────────────────────────────────────────
    VisaThreshold:
      type: object
      properties:
        minTransactions:
          type: integer
        minVolumeUsd:
          type: number
        requiresBoth:
          type: boolean
        requiresManualReview:
          type: boolean

    VisaTierSummary:
      type: object
      properties:
        agentId:
          $ref: "#/components/schemas/DecimalId"
        tier:
          type: integer
          enum: [0, 1, 2, 3]
        tierName:
          type: string
          enum: [None, Tourist Visa, Work Visa, Citizenship]

    VisaSignature:
      type: object
      required: [chainId, signature, timestamp]
      properties:
        chainId:
          oneOf:
            - type: integer
            - type: string
          description: 42220 or 11142220
        signature:
          type: string
          pattern: "^0x[0-9a-fA-F]{130}$"
          description: personal_sign over the visa request message (see the Visa tag)
        timestamp:
          type: integer
          description: Unix ms; the same value that was signed

    VisaRequirementError:
      type: object
      description: >
        422 body. `code` is NOT_ELIGIBLE (metrics below the tier thresholds,
        with `metrics` and `required`) or REVIEW_REQUIRED (tier needs manual
        approval); other 422s carry only `error`.
      properties:
        error:
          type: string
        code:
          type: string
          enum: [NOT_ELIGIBLE, REVIEW_REQUIRED]
        reviewRequested:
          type: boolean
        metrics:
          type: object
          properties:
            transactionCount:
              type: integer
            volumeUsd:
              type: number
        required:
          type: object
          properties:
            minTransactions:
              type: integer
            minVolumeUsd:
              type: number
            requiresBoth:
              type: boolean

    CliRegisterPayload:
      description: Decoded /cli/register payload, as built by the self-agent CLIs
      type: object
      required:
        [
          version,
          operation,
          mode,
          chainId,
          endpointType,
          registryAddress,
          appName,
          scope,
          humanIdentifier,
          userDefinedData,
          expiresAt,
        ]
      properties:
        version:
          const: 1
        operation:
          enum: [register, deregister]
        mode:
          type: string
          enum: [linked, wallet-free, self-custody, smartwallet]
          description: >
            linked or wallet-free. `self-custody` is accepted from older
            CLIs; `smartwallet` only with operation `deregister`; ed25519
            modes are rejected.
        chainId:
          enum: [42220, 11142220]
          description: Must match endpointType
        endpointType:
          enum: [celo, staging_celo]
        registryAddress:
          type: string
          description: The registry of that network
        appName:
          const: Self Agent ID
        scope:
          const: self-agent-id
        humanIdentifier:
          type: string
          description: Non-zero 0x address (the Self app userId)
        userDefinedData:
          type: string
          pattern: "^[0-9A-Za-z]{2,600}$"
        disclosures:
          $ref: "#/components/schemas/Disclosures"
        expiresAt:
          type: integer
          description: Unix ms; later requests get 410

    # ── Discovery ────────────────────────────────────────────────────
    DiscoveryDocument:
      type: object
      properties:
        service:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            url:
              type: string
        privacy:
          type: string
        registrationModes:
          type: object
          description: Keyed by canonical mode name
          additionalProperties:
            type: object
            properties:
              label:
                type: string
              description:
                type: string
              keyType:
                type: string
              walletNeeded:
                type: boolean
              bestFor:
                type: string
        modeAliases:
          type: object
          additionalProperties:
            type: string
        modeDecisionTree:
          type: string
        apiEndpoints:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
              path:
                type: string
              description:
                type: string
        erc8004:
          type: object
          additionalProperties: true
        networks:
          type: object
          additionalProperties:
            type: object
            properties:
              label:
                type: string
              chainId:
                type: integer
              registryAddress:
                $ref: "#/components/schemas/Address"
              rpcUrl:
                type: string
              isTestnet:
                type: boolean
        humanRequirement:
          type: string
        sdkPackages:
          type: object
          additionalProperties:
            type: string
        documentation:
          type: object
          additionalProperties:
            type: string

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type: ["string", "integer", "null"]
        result:
          description: 'A2A Task (`kind: "task"`) for message/send, tasks/get and tasks/cancel'
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string

paths:
  # ── Registration ─────────────────────────────────────────────────
  /api/agent/register:
    post:
      tags: [Registration]
      summary: Start a registration session
      operationId: startRegistration
      description: >
        Generates the agent key (linked, wallet-free, privy, smartwallet) or
        verifies the agent's Ed25519 challenge signature (ed25519,
        ed25519-linked), and returns the Self app QR for the human. Poll
        GET /api/agent/register/status until `completed`. Rate limit: 10/min
        per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              mode: linked
              network: testnet
              humanAddress: "0x83fa4380903fecb801F4e123835664973001ff00"
              disclosures:
                minimumAge: 18
                ofac: true
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/SessionStartServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/register/status:
    get:
      tags: [Registration]
      summary: Poll a registration
      operationId: getRegistrationStatus
      description: >
        Checks the registry on-chain. Stage is `qr-ready` until the agent is
        minted, then `completed` with `agentId`. The poll that first observes
        completion resets `expiresAt` to 30 minutes from then so the key can
        still be exported. A session holding a server-generated key can still
        be polled up to 24 hours after it expired (the Self deep link never
        expires): if the agent was minted meanwhile it answers `completed`
        with a fresh 30-minute export window, otherwise 410. Rate limit:
        120/min per IP.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterStatusResponse"
        "400":
          description: Missing Authorization header, or not a registration token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/register/qr:
    get:
      tags: [Registration]
      summary: Re-fetch the QR of a session
      operationId: getRegistrationQr
      description: >
        Returns the Self app request (`qrData`), its deep link and a fresh
        `scanUrl` for a registration session that is still `qr-ready`. Rate
        limit: 120/min per IP.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: QR data
          content:
            application/json:
              schema:
                type: object
                required: [deepLink, qrData, scanUrl]
                properties:
                  deepLink:
                    type: string
                  qrData:
                    $ref: "#/components/schemas/SelfApp"
                  scanUrl:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          description: Session is no longer `qr-ready`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/agent/register/export:
    post:
      tags: [Registration]
      summary: Export the generated agent key
      operationId: exportAgentKey
      description: >
        Returns the server-generated private key (linked, wallet-free, privy,
        smartwallet) once the session is `completed`. Use the rotated token
        from the status poll that observed completion; the original token
        still says `qr-ready` and gets 409. Send the token as
        `Authorization: Bearer` (preferred) or as `{ "token": ... }`.
        Every response, errors included, is sent with
        `Cache-Control: no-store`. Rate limit: 120/min per IP.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Session token, if not sent as a Bearer header
      responses:
        "200":
          description: Private key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
        "400":
          description: >
            No token, not a registration token, or an ed25519 /
            ed25519-linked session (the agent holds its own key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "409":
          description: Registration not completed for this token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Cannot export key until registration is complete. Current stage: qr-ready"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/agent/register/ed25519-challenge:
    post:
      tags: [Registration]
      summary: Get the Ed25519 registration challenge
      operationId: getEd25519Challenge
      description: >
        Step 1 of Ed25519 registration. Sign the 32 raw bytes of
        `challengeHash` with the agent's Ed25519 key and send the hex
        signature as `ed25519Signature` to POST /api/agent/register with the
        same `humanAddress` (omit it for `ed25519`; pass the guardian wallet
        for `ed25519-linked`). Rate limit: 10/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, network]
              properties:
                pubkey:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                network:
                  $ref: "#/components/schemas/Network"
                humanAddress:
                  allOf:
                    - $ref: "#/components/schemas/Address"
                  description: Defaults to the address derived from the pubkey
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeHash:
                    type: string
                    description: 0x-prefixed keccak256 hash (32 bytes)
                  nonce:
                    type: string
                    description: Registry ed25519Nonce for this key (decimal)
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/register/ed25519-check:
    get:
      tags: [Registration]
      summary: Check whether an Ed25519 key is registered
      operationId: checkEd25519Registration
      description: "Looks the public key up in the registry. Rate limit: 120/min per IP."
      parameters:
        - name: pubkey
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
        - name: network
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Network"
      responses:
        "200":
          description: Registration state
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered:
                    type: boolean
                  agentId:
                    type: integer
                  agentAddress:
                    $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/qr/{qrToken}:
    get:
      tags: [Registration]
      summary: QR code PNG behind a scanUrl
      operationId: getQrImage
      description: >
        Renders the QR of a session's deep link. Accepts only the QR token
        embedded in a `scanUrl` (session tokens are rejected). Rate limit:
        60/min per IP.
      parameters:
        - name: qrToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/QrPng"
        "401":
          description: Not a valid QR token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/SessionStartServerError"

  /cli/register:
    get:
      tags: [Registration]
      summary: QR for a CLI registration handoff
      operationId: cliRegisterQr
      description: >
        The URL printed by `self-agent register open`. Rebuilds the Self app
        request from the CLI payload and returns its QR as a PNG; the CLI's
        `register wait` then polls the registry. Only requests for this
        app's registry, app name and scope are rendered. Rate limit: 60/min
        per IP.
      parameters:
        - name: payload
          in: query
          required: true
          description: base64url-encoded JSON (at most 8192 characters encoded)
          schema:
            type: string
            contentEncoding: base64url
            contentMediaType: application/json
            contentSchema:
              $ref: "#/components/schemas/CliRegisterPayload"
      responses:
        "200":
          $ref: "#/components/responses/QrPng"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Payload `expiresAt` has passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/QrRenderFailed"

  # ── Lifecycle ────────────────────────────────────────────────────
  /api/agent/deregister:
    post:
      tags: [Lifecycle]
      summary: Start a deregistration session
      operationId: startDeregistration
      description: >
        The human re-proves with the Self app and the registry burns the
        agent NFT. Identify the agent by `agentAddress` and/or `agentId`.
        Ed25519 agents cannot be removed this way (400): their guardian
        calls `guardianRevoke(agentId)` or the NFT owner `selfDeregister(agentId)`
        on the registry. Rate limit: 10/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network]
              properties:
                network:
                  $ref: "#/components/schemas/Network"
                agentAddress:
                  $ref: "#/components/schemas/Address"
                agentId:
                  $ref: "#/components/schemas/AgentIdInput"
                disclosures:
                  $ref: "#/components/schemas/Disclosures"
            example:
              network: testnet
              agentId: 66
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeregisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/SessionStartServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/deregister/status:
    get:
      tags: [Lifecycle]
      summary: Poll a deregistration
      operationId: getDeregistrationStatus
      description: >
        `completed` once the agent no longer has a human proof on-chain.
        Rate limit: 120/min per IP.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionStatus"
                  - type: object
                    properties:
                      stage:
                        type: string
                        enum: [qr-ready, completed]
                      agentAddress:
                        $ref: "#/components/schemas/Address"
                      agentId:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/identify:
    post:
      tags: [Lifecycle]
      summary: Start an identify session
      operationId: startIdentify
      description: >
        The human scans a QR so the registry emits their nullifier; poll
        GET /api/agent/identify/status, then list their agents with
        GET /api/agent/agents-by-nullifier. Nothing changes on-chain. Rate
        limit: 10/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network]
              properties:
                network:
                  $ref: "#/components/schemas/Network"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionStart"
                  - type: object
                    properties:
                      network:
                        $ref: "#/components/schemas/Network"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/SessionStartServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/identify/status:
    get:
      tags: [Lifecycle]
      summary: Poll an identify session
      operationId: getIdentifyStatus
      description: >
        Scans the registry's NullifierIdentified events for this session's
        proof. The rotated `sessionToken` records the last block scanned, so
        each poll only scans blocks added since the previous poll (plus a
        5-block overlap): always send the newest token. Rate limit: 120/min
        per IP.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionStatus"
                  - type: object
                    properties:
                      stage:
                        type: string
                        enum: [qr-ready, completed]
                      nullifier:
                        $ref: "#/components/schemas/DecimalId"
                      agentCount:
                        type: integer
                        description: Active agents for this human (when completed)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/refresh:
    post:
      tags: [Lifecycle]
      summary: Start a proof refresh session
      operationId: startProofRefresh
      description: >
        Renews an agent's human proof. `disclosures` defaults to the agent's
        on-chain config; if given, it must select the same config (400
        otherwise). An agent with no stored verification config (registered
        before config tracking, or through an external proof provider) cannot
        be refreshed in place (400): deregister it and register again. Rate limit: 10/min per IP.


        Known limitation (422): the deployed registry reads the agent id from
        the raw proof data, but the Self app UTF-8-encodes it, so agents whose
        32-byte big-endian id contains a byte >= 0x80 (e.g. 128-255, 384-511,
        32768+) cannot be refreshed until the registry is upgraded. Workaround:
        deregister and register again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, network]
              properties:
                agentId:
                  $ref: "#/components/schemas/AgentIdInput"
                network:
                  $ref: "#/components/schemas/Network"
                disclosures:
                  $ref: "#/components/schemas/Disclosures"
            example:
              agentId: 66
              network: testnet
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: This agent id cannot be encoded in a refresh proof (see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/SessionStartServerError"
        "502":
          $ref: "#/components/responses/RpcError"
    get:
      tags: [Lifecycle]
      summary: Shareable refresh link
      operationId: refreshRedirect
      description: >
        Redirects (302) straight to the Self app request for refreshing the
        agent's proof, using its on-chain config. Used as the SDK's re-auth
        URL. Completion is detected on-chain. Rate limit: 20/min per IP.
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: network
          in: query
          schema:
            $ref: "#/components/schemas/Network"
        - name: chainId
          in: query
          description: Alternative to network (must agree if both are given)
          schema:
            type: string
            enum: ["42220", "11142220"]
        - name: registry
          in: query
          description: If given, must equal this service's registry for the chain
          schema:
            $ref: "#/components/schemas/Address"
      responses:
        "302":
          description: >
            Redirect to the Self universal link (`Cache-Control: no-store`,
            with the standard CORS headers)
          headers:
            Location:
              schema:
                type: string
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "422":
          description: This agent id cannot be encoded in a refresh proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/refresh/status:
    get:
      tags: [Lifecycle]
      summary: Poll a proof refresh
      operationId: getRefreshStatus
      description: >
        `completed` once the on-chain proof expiry moves forward (with the new
        `proofExpiresAt`); `failed` if the agent was deregistered first. Rate
        limit: 120/min per IP.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SessionStatus"
                  - type: object
                    properties:
                      stage:
                        type: string
                        enum: [qr-ready, completed, failed]
                      agentId:
                        type: integer
                      proofExpiresAt:
                        $ref: "#/components/schemas/IsoDateTime"
                      error:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/RpcError"

  # ── Query ────────────────────────────────────────────────────────
  /api/agent/info/{chainId}/{agentId}:
    get:
      tags: [Query]
      summary: Agent details
      operationId: getAgentInfo
      description: "Rate limit: shared per-IP read budget of 120/min."
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - $ref: "#/components/parameters/AgentIdPath"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInfoResponse"
              example:
                agentId: 5
                chainId: 11142220
                agentKey: "0x000000000000000000000000a7f2b8a0ba50b099ee2ad16a91176bed96e103f7"
                agentAddress: "0xA7F2B8A0Ba50b099Ee2ad16A91176bED96E103F7"
                isVerified: true
                hasHumanProof: true
                isProofFresh: true
                proofExpiresAt: "2027-02-27T05:50:54.000Z"
                proofProvider: "0x5E61c3051Bf4115F90AacEAE6212bc419f8aBB6c"
                registeredAtBlock: 18887466
                verificationStrength: 100
                strengthLabel: passport
                credentials:
                  nationality: null
                  olderThan: 0
                  ofac: [false, false, false]
                network: testnet
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/verify/{chainId}/{agentId}:
    get:
      tags: [Query]
      summary: Proof-of-human and sybil view
      operationId: verifyAgent
      description: "Rate limit: shared per-IP read budget of 120/min."
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - $ref: "#/components/parameters/AgentIdPath"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProofState"
                  - type: object
                    properties:
                      agentId:
                        type: integer
                      chainId:
                        type: integer
                      proofProvider:
                        $ref: "#/components/schemas/Address"
                      isSelfProvider:
                        type: boolean
                      verificationStrength:
                        type: integer
                      strengthLabel:
                        type: string
                      humanNullifier:
                        type: string
                        description: Decimal; "0" without a proof
                      agentCountForHuman:
                        type: integer
              example:
                agentId: 5
                chainId: 11142220
                isVerified: true
                hasHumanProof: true
                isProofFresh: true
                proofExpiresAt: "2027-02-27T05:50:54.000Z"
                proofProvider: "0x5E61c3051Bf4115F90AacEAE6212bc419f8aBB6c"
                isSelfProvider: true
                verificationStrength: 100
                strengthLabel: passport
                humanNullifier: "10532525450741824009985382101719946210697770609024411207137570480189113860982"
                agentCountForHuman: 13
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/verify-status/{chainId}/{agentId}:
    get:
      tags: [Query]
      summary: Compact proof status
      operationId: getVerifyStatus
      description: "Rate limit: shared per-IP read budget of 120/min."
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - $ref: "#/components/parameters/AgentIdPath"
      responses:
        "200":
          description: Proof status
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    description: hasHumanProof && isProofFresh
                  hasHumanProof:
                    type: boolean
                  isProofFresh:
                    type: boolean
                  proofExpiresAt:
                    type: ["string", "null"]
                  proofType:
                    type: string
                  registeredAtBlock:
                    type: integer
                  providerAddress:
                    $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/reputation/{chainId}/{agentId}:
    get:
      tags: [Query]
      summary: Verification strength score
      operationId: getReputation
      description: "Rate limit: shared per-IP read budget of 120/min."
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - $ref: "#/components/parameters/AgentIdPath"
      responses:
        "200":
          description: Reputation
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                    description: Provider verification strength, 0-100
                  hasProof:
                    type: boolean
                  isVerified:
                    type: boolean
                  isProofFresh:
                    type: boolean
                  proofExpiresAt:
                    type: ["string", "null"]
                  providerName:
                    type: ["string", "null"]
                  proofType:
                    type: string
              example:
                score: 100
                hasProof: true
                isVerified: true
                isProofFresh: true
                proofExpiresAt: "2027-02-27T05:50:54.000Z"
                providerName: self
                proofType: passport
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/cards/{chainId}/{agentId}:
    get:
      tags: [Query]
      summary: ERC-8004 agent card
      operationId: getAgentCard
      description: "Rate limit: shared per-IP read budget of 120/min."
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - $ref: "#/components/parameters/AgentIdPath"
      responses:
        "200":
          description: Agent card (cacheable for 60 s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/agents/{chainId}/{address}:
    get:
      tags: [Query]
      summary: Agents for a wallet
      operationId: listAgentsForAddress
      description: >
        Every agent NFT the address owns, plus the agent whose key is this
        address. The registry is not enumerable, so owned ids come from a
        bounded scan; `complete` is false if it could not find all
        `ownedCount` of them. A zero, ICAP or un-prefixed address is a 400
        "Invalid address". Rate limit: shared per-IP scan budget of 20/min.
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  humanAddress:
                    $ref: "#/components/schemas/Address"
                  chainId:
                    type: integer
                  agents:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/AgentSummary"
                        - type: object
                          properties:
                            isOwner:
                              type: boolean
                              description: The address owns this agent's NFT
                            isAgentKey:
                              type: boolean
                              description: The address is this agent's key
                  totalCount:
                    type: integer
                  ownedCount:
                    type: integer
                    description: On-chain balanceOf(address)
                  complete:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/agent/agents-by-nullifier/{chainId}/{nullifier}:
    get:
      tags: [Query]
      summary: Active agents of one human
      operationId: listAgentsForNullifier
      description: "Rate limit: shared per-IP scan budget of 20/min."
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - name: nullifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DecimalId"
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  nullifier:
                    type: string
                  chainId:
                    type: integer
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSummary"
                  totalCount:
                    type: integer
                  activeAgentCount:
                    type: integer
                    description: The registry's own counter for this human
                  complete:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  # ── Visa ─────────────────────────────────────────────────────────
  /api/visa/{chainId}/{agentId}:
    get:
      tags: [Visa]
      summary: Visa tier, metrics and eligibility
      operationId: getVisa
      description: >
        Read-only; eligibility uses the visa wallet's live transaction count.
        Rate limit: shared per-IP read budget of 120/min.
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - $ref: "#/components/parameters/VisaAgentIdPath"
      responses:
        "200":
          description: Visa status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VisaTierSummary"
                  - type: object
                    properties:
                      chainId:
                        type: integer
                      metrics:
                        type: object
                        properties:
                          transactionCount:
                            type: integer
                          volumeUsd:
                            type: number
                          lastUpdated:
                            type: integer
                      eligibility:
                        type: object
                        description: Keyed by tier "1", "2", "3"
                        additionalProperties:
                          type: boolean
                      reviewRequestedTier:
                        type: integer
                      manualReviewApproved:
                        type: boolean
                      thresholds:
                        type: object
                        description: Keyed by tier "1", "2", "3"
                        additionalProperties:
                          $ref: "#/components/schemas/VisaThreshold"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No visa and no registry agent under this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/visa/{chainId}/batch:
    get:
      tags: [Visa]
      summary: Visa tiers for many agents
      operationId: getVisaBatch
      description: >
        Duplicate ids are collapsed: each distinct id appears once in
        `agents`, in first-seen order. Rate limit: 60/min per IP.
      parameters:
        - $ref: "#/components/parameters/ChainIdPath"
        - name: agents
          in: query
          required: true
          description: >
            Comma-separated decimal ids, at most 100 (counted before
            duplicates are removed); any invalid id is a 400
          schema:
            type: string
          example: "1,5,66"
      responses:
        "200":
          description: Tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/VisaTierSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/visa/agents:
    get:
      tags: [Visa]
      summary: Agent ids for a wallet
      operationId: getVisaAgentsForWallet
      description: >
        Registry agents the wallet owns or whose key it is (the same bounded
        id scan as /api/agent/agents), plus the wallet-based visa id if it
        holds a visa. `complete` is false if the scan could not find every
        agent `balanceOf` reports. A zero, ICAP or un-prefixed address is a
        400 "Invalid address". Rate limit: shared per-IP scan budget of 20/min.
      parameters:
        - name: wallet
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Address"
        - name: chainId
          in: query
          required: true
          schema:
            type: string
            enum: ["42220", "11142220"]
      responses:
        "200":
          description: Agent ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete:
                    type: boolean
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        agentId:
                          $ref: "#/components/schemas/DecimalId"
                        chainId:
                          type: integer
                        isWalletBased:
                          type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/RpcError"

  /api/visa/claim:
    post:
      tags: [Visa]
      summary: Mint or upgrade a visa (gasless)
      operationId: claimVisa
      description: >
        Signed with action `claim`. Mints the visa (tier 0) or upgrades it.
        Tiers 2-3 need a registry agent with a fresh human proof. The relayer
        updates metrics first when the stored ones fall short. Limits and
        retry rules: see the Visa tag (20 attempts/h per IP; relayed
        transactions 5/h per IP, 2/h per signer, 50/h global; re-sign after
        any error, including a 5xx).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VisaSignature"
                - type: object
                  required: [agentId, targetTier]
                  properties:
                    agentId:
                      $ref: "#/components/schemas/DecimalId"
                    targetTier:
                      type: integer
                      enum: [1, 2, 3]
                    agentWallet:
                      allOf:
                        - $ref: "#/components/schemas/Address"
                      description: If given, must be the signer
      responses:
        "200":
          description: Transaction mined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agentId:
                    $ref: "#/components/schemas/DecimalId"
                  previousTier:
                    type: integer
                  newTier:
                    type: integer
                  wallet:
                    $ref: "#/components/schemas/Address"
                  txHash:
                    type: string
                  blockNumber:
                    type: ["integer", "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSignature"
        "403":
          description: Signer not authorized for this agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "409":
          description: Agent already at or above targetTier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Not eligible, manual review required, or no fresh registry proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaRequirementError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/VisaWriteFailed"
        "503":
          $ref: "#/components/responses/RelayerNotConfigured"

  /api/visa/migrate:
    post:
      tags: [Visa]
      summary: Move a wallet-based visa to a registry agent
      operationId: migrateVisa
      description: >
        Signed with action `migrate` by the wallet behind `oldAgentId`
        (= uint160(connectedWallet)), which must also own or be the key of
        `newAgentId`. Mints the visa under `newAgentId` with the old visa's
        wallet; the old visa stays on-chain. A tier that needs manual review
        gets the same 422 `REVIEW_REQUIRED` as claim. Limits and retry rules:
        see the Visa tag (20 attempts/h per IP; relayed transactions 5/h per
        IP, 2/h per signer, 50/h global; re-sign after any error, including
        a 5xx).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VisaSignature"
                - type: object
                  required: [oldAgentId, newAgentId, connectedWallet]
                  properties:
                    oldAgentId:
                      $ref: "#/components/schemas/DecimalId"
                    newAgentId:
                      $ref: "#/components/schemas/DecimalId"
                    connectedWallet:
                      allOf:
                        - $ref: "#/components/schemas/Address"
                      description: Must be the signer
                    targetTier:
                      type: integer
                      enum: [1, 2, 3]
                      default: 1
      responses:
        "200":
          description: Transaction mined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  oldAgentId:
                    $ref: "#/components/schemas/DecimalId"
                  newAgentId:
                    $ref: "#/components/schemas/DecimalId"
                  migratedWallet:
                    $ref: "#/components/schemas/Address"
                  migratedTxCount:
                    type: integer
                  newTier:
                    type: integer
                  txHash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSignature"
        "403":
          description: Signer is not connectedWallet, does not match oldAgentId, or is not authorized for newAgentId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "409":
          description: New agent already has a visa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: >
            No old visa or stored wallet, no fresh proof on the new agent,
            manual review required (REVIEW_REQUIRED), or not eligible
            (NOT_ELIGIBLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaRequirementError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/VisaWriteFailed"
        "503":
          $ref: "#/components/responses/RelayerNotConfigured"

  /api/visa/request-review:
    post:
      tags: [Visa]
      summary: Request manual review for tier 2 or 3
      operationId: requestVisaReview
      description: >
        Signed with action `request-review`. The agent must hold a visa below
        `targetTier` and be a registry agent. Limits and retry rules: see the
        Visa tag (20 attempts/h per IP; relayed transactions 5/h per IP, 2/h
        per signer, 50/h global; re-sign after any error, including a 5xx).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VisaSignature"
                - type: object
                  required: [agentId, targetTier]
                  properties:
                    agentId:
                      $ref: "#/components/schemas/DecimalId"
                    targetTier:
                      type: integer
                      enum: [2, 3]
      responses:
        "200":
          description: Transaction mined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agentId:
                    $ref: "#/components/schemas/DecimalId"
                  targetTier:
                    type: integer
                  txHash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidSignature"
        "403":
          description: Signer not authorized for this agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/AgentNotFound"
        "409":
          description: Already at or above the tier, or review already requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: No visa yet, or not a registry agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/VisaWriteFailed"
        "503":
          $ref: "#/components/responses/RelayerNotConfigured"

  # ── Discovery ────────────────────────────────────────────────────
  /:
    get:
      tags: [Discovery]
      summary: Content-negotiated root
      operationId: getRoot
      description: >
        `Accept: application/json` serves the discovery document,
        `Accept: text/plain` serves llms.txt; anything else (browsers) gets a
        308 to https://docs.self.xyz. Removed UI paths (/agents, /register,
        ...) also 308 to the docs.
      responses:
