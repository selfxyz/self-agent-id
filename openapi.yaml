            text/plain:
              schema:
                type: string

  /.well-known/agent-card.json:
    get:
      tags: [Discovery]
      summary: Registry or agent card
      operationId: getWellKnownAgentCard
      description: >
        Without `agentId`: the A2A card of the registry itself (skills,
        JSON-RPC endpoint). With `agentId`: the same per-agent card as
        /api/cards/{chainId}/{agentId} (counted against the 120/min read
        budget).
      parameters:
        - name: agentId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: chainId
          in: query
          description: Default 42220 (`chain` is accepted too)
          schema:
            type: string
            enum: ["42220", "11142220"]
      responses:
        "200":
          description: Agent card
